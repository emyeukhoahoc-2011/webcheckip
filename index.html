<body>
  <main class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">⌘</div>
        DONI NETWORK TOOLS
      </div>

      <h1>My <span>IP Address</span></h1>

      <p class="subtitle">
        Kiểm tra địa chỉ IP công khai của bạn.<br>
        Nhanh chóng · Chính xác · Miễn phí
      </p>
    </header>

    <section class="panel">
      <div class="panel-title">
        <h2>Thông tin kết nối</h2>
        <div class="live">
          <span class="dot"></span>
          IP CHECKER
        </div>
      </div>

      <div class="ip-card">
        <div class="ip-top">
          <div class="ip-type">
            <span>IPv4</span>
            <span class="version">32-BIT</span>
          </div>
        </div>

        <div class="ip-row">
          <div class="ip-address" id="ipv4">Đang tải...</div>
          <button class="copy-btn" data-copy="ipv4">
            Sao chép
          </button>
        </div>
      </div>

      <div class="ip-card">
        <div class="ip-top">
          <div class="ip-type">
            <span>IPv6</span>
            <span class="version">128-BIT</span>
          </div>
        </div>

        <div class="ip-row">
          <div class="ip-address" id="ipv6">Đang tải...</div>
          <button class="copy-btn" data-copy="ipv6">
            Sao chép
          </button>
        </div>
      </div>

      <div class="bottom">
        <div class="status">
          <span class="dot"></span>
          <span id="status">Đang kiểm tra kết nối...</span>
        </div>

        <button class="refresh-btn" id="refresh">
          ↻ Làm mới IP
        </button>
      </div>
    </section>

    <footer class="footer">
      <strong>DONI</strong><br>
      IP Checker · © 2026
    </footer>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    async function fetchIP(id, endpoint) {
      const element = $(id);
      element.textContent = "Đang tải...";

      try {
        const response = await fetch(endpoint, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const data = await response.json();

        if (!data.ip) {
          throw new Error("No IP returned");
        }

        element.textContent = data.ip;
      } catch {
        element.textContent = "Không khả dụng";
      }
    }

    async function loadIPs() {
      $("status").textContent = "Đang kiểm tra...";
      $("refresh").disabled = true;

      await Promise.all([
        fetchIP("ipv4", "https://api4.ipify.org?format=json"),
        fetchIP("ipv6", "https://api6.ipify.org?format=json")
      ]);

      $("status").textContent = "Đã kiểm tra xong";
      $("refresh").disabled = false;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";

      document.body.appendChild(textarea);
      textarea.select();

      const success = document.execCommand("copy");
      textarea.remove();

      if (!success) {
        throw new Error("Copy failed");
      }
    }

    document.querySelectorAll("[data-copy]").forEach(button => {
      button.addEventListener("click", async () => {
        const id = button.dataset.copy;
        const ip = $(id).textContent;

        if (
          !ip ||
          ip === "Đang tải..." ||
          ip === "Không khả dụng"
        ) {
          $("status").textContent = "Không có IP để sao chép";
          return;
        }

        try {
          await copyText(ip);
          button.textContent = "Đã sao chép ✓";
          $("status").textContent = "Đã sao chép địa chỉ " + id.toUpperCase();

          setTimeout(() => {
            button.textContent = "Sao chép";
          }, 1500);
        } catch {
          $("status").textContent = "Không thể sao chép địa chỉ IP";
        }
      });
    });

    $("refresh").addEventListener("click", loadIPs);

    loadIPs();
  </script>
</body>
</html>
